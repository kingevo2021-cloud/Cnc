async function serverLogin(email,password){const r=await azApi('/auth/login',{method:'POST',body:JSON.stringify({email,password})});localStorage.setItem('az_jwt',r.token);localStorage.setItem('az_token',btoa(JSON.stringify({email:r.admin.email,exp:Date.now()+7*864e5})));return r}

const getToken=()=>localStorage.getItem('az_token');
function isAdmin(){const tk=getToken();if(!tk)return false;try{const d=JSON.parse(atob(tk));return Date.now()<d.exp}catch(e){return false}}
async function adminLogin(e){e.preventDefault();const em=$('#al-email').value.trim().toLowerCase(),pw=$('#al-pass').value;try{await serverLogin(em,pw);toast(t('login_success'));location.hash='#/admin';render()}catch(err){const a=DB.admins.find(x=>x.email===em&&x.pass===pw);if(a){localStorage.setItem('az_token',btoa(JSON.stringify({email:em,exp:Date.now()+864e5})));toast(t('login_success'));location.hash='#/admin';render()}else toast(err.message||t('login_error'),'error')}}
function adminLogout(){localStorage.removeItem('az_token');location.hash='#/';render()}

/* ---------- FAVS / RATINGS / VIEWS ---------- */
const getFavs=()=>{try{return JSON.parse(localStorage.getItem('az_favs')||'[]')}catch(e){return[]}};
function isFav(ty,id){return getFavs().some(f=>f.type===ty&&f.id===id)}
function toggleFav(ty,id){let f=getFavs();const i=f.findIndex(x=>x.type===ty&&x.id===id);if(i>=0){f.splice(i,1);toast(t('fav_removed'))}else{f.push({type:ty,id});toast(t('fav_added'))}localStorage.setItem('az_favs',JSON.stringify(f));renderHeader();render()}
function clearFavs(){if(confirm(t('confirm_delete'))){localStorage.removeItem('az_favs');render()}}
function findItem(ty,id){if(ty==='app')return DB.apps.find(x=>x.id===id);if(ty==='video')return DB.videos.find(x=>x.id===id);return DB.websites.find(x=>x.id===id)}
function incView(ty,id){const it=findItem(ty,id);if(!it)return;it.views=(+it.views||0)+1;const h=DB.stats.history.find(x=>x.date===todayStr());if(h)h.views++;else DB.stats.history.push({date:todayStr(),views:1,downloads:0});if(DB.stats.history.length>30)DB.stats.history.shift();saveDB()}
function incDownload(id){const it=DB.apps.find(x=>x.id===id);if(!it)return;it.downloads=(+it.downloads||0)+1;const h=DB.stats.history.find(x=>x.date===todayStr());if(h)h.downloads=(+h.downloads||0)+1;saveDB()}
function rateItem(ty,id,s){const k=`rated_${ty}_${id}`;if(localStorage.getItem(k)){toast(t('already_rated'),'error');return}const it=findItem(ty,id);if(!it)return;DB.ratings.push({id:uid(),itemType:ty,itemId:id,stars:s,createdAt:new Date().toISOString()});const all=DB.ratings.filter(r=>r.itemType===ty&&r.itemId===id);const base=it.ratingsCount||0,avg=it.ratingAvg||0;const newCount=base+1;it.ratingAvg=((avg*base+s)/newCount);it.ratingsCount=newCount;localStorage.setItem(k,s);saveDB();toast(t('rated_success'));render()}

/* Search */
function renderSearch(){
const q=new URLSearchParams((location.hash.split('?')[1]||''));
const query=q.get('q')||'',type=q.get('type')||'all',cat=q.get('cat')||'',sort=q.get('sort')||'newest';
let items=[...DB.apps.filter(a=>a.active).map(x=>({...x,_t:'app',_n:L(x,'name')})),...DB.videos.filter(v=>v.active).map(x=>({...x,_t:'video',_n:L(x,'title')})),...DB.websites.filter(w=>w.active).map(x=>({...x,_t:'website',_n:L(x,'name')}))];
if(query)items=items.filter(x=>(x._n+' '+L(x,'desc')).toLowerCase().includes(query.toLowerCase()));
if(type!=='all')items=items.filter(x=>type==='video'?x._t==='video':type==='website'?x._t==='website':x.type===type);
if(cat)items=items.filter(x=>x.category===cat);
if(sort==='views')items.sort((a,b)=>b.views-a.views);else if(sort==='rating')items.sort((a,b)=>b.ratingAvg-a.ratingAvg);else if(sort==='downloads')items.sort((a,b)=>(b.downloads||0)-(a.downloads||0));else items.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
$('#view').innerHTML=`<div class="max-w-7xl mx-auto px-4 md:px-6 py-8">
<div class="anim rounded-3xl grad-bg hero-pattern p-8 text-white mb-6"><h1 class="text-2xl md:text-3xl font-black">🔍 ${t('search')}</h1><p class="opacity-85 text-sm mt-1">${items.length} ${t('results')}${query?` — "${esc(query)}"`:''}</p></div>
<div class="anim anim-1 bg-white dark:bg-slate-900 rounded-2xl border p-4 grid md:grid-cols-5 gap-3 mb-6">
<input id="s-q" value="${esc(query)}" class="input md:col-span-2" placeholder="${t('search_ph')}" onkeyup="if(event.key==='Enter')applySearch()">
<select id="s-type" class="input"><option value="all">${t('type')}: ${t('all')}</option><option value="app" ${type==='app'?'selected':''}>📱 ${t('apps')}</option><option value="game" ${type==='game'?'selected':''}>🎮 ${t('games')}</option><option value="ai" ${type==='ai'?'selected':''}>🤖 ${t('ai_tools')}</option><option value="tool" ${type==='tool'?'selected':''}>🧰 ${t('tools')}</option><option value="video" ${type==='video'?'selected':''}>🎬 ${t('videos')}</option><option value="website" ${type==='website'?'selected':''}>🌐 ${t('websites')}</option></select>
<select id="s-cat" class="input"><option value="">${t('category')}: ${t('all')}</option>${DB.categories.map(c=>`<option value="${c.slug}" ${cat===c.slug?'selected':''}>${c.icon} ${LANG==='ar'?c.name_ar:c.name_en}</option>`).join('')}</select>
<select id="s-sort" class="input"><option value="newest" ${sort==='newest'?'selected':''}>${t('sort_newest')}</option><option value="views" ${sort==='views'?'selected':''}>${t('sort_views')}</option><option value="rating" ${sort==='rating'?'selected':''}>${t('sort_rating')}</option><option value="downloads" ${sort==='downloads'?'selected':''}>${t('sort_downloads')}</option></select>
<button onclick="applySearch()" class="btn-p rounded-xl font-black md:col-span-5 py-3">🔍 ${t('search')}</button></div>
<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${items.map((x,i)=>x._t==='app'?appCard(x,i):x._t==='video'?videoCard(x,i):siteCard(x,i)).join('')||emptyBox()}</div></div>`;
setSEO(t('search')+' | '+siteName());
}
function applySearch(){const q=$('#s-q').value.trim(),ty=$('#s-type').value,c=$('#s-cat').value,s=$('#s-sort').value;location.hash=`#/search?q=${encodeURIComponent(q)}&type=${ty}&cat=${c}&sort=${s}`}

function setSEO(title,desc){document.title=title;const m=document.querySelector('meta[name="description"]');if(m&&desc)m.content=desc}
function injectLD(obj){let el=document.getElementById('ld-json');if(el)el.remove();el=document.createElement('script');el.id='ld-json';el.type='application/ld+json';el.textContent=JSON.stringify(obj);document.head.appendChild(el)}

/* CRUD */
function toggleFeat(ty,id){const it=findItem(ty,id)||DB.categories.find(c=>c.id===id);if(it){it.featured=!it.featured;saveDB();renderAdmin()}}
function toggleActive(ty,id){let it=ty==='category'?DB.categories.find(c=>c.id===id):findItem(ty,id);if(it){it.active=it.active===false?true:false;if(ty==='category')it.active=!it.active;saveDB();renderAdmin()}}
function delItem(ty,id){if(!confirm(t('confirm_delete')))return;if(ty==='app')DB.apps=DB.apps.filter(x=>x.id!==id);if(ty==='video')DB.videos=DB.videos.filter(x=>x.id!==id);if(ty==='website')DB.websites=DB.websites.filter(x=>x.id!==id);if(ty==='category')DB.categories=DB.categories.filter(x=>x.id!==id);saveDB();toast(t('deleted'));renderAdmin();renderHeader()}
function exportDB(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='appzone-backup-'+todayStr()+'.json';a.click();toast(t('saved'))}
function importDB(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);saveDB();applySettings();toast(t('saved'));renderAdmin()}catch(err){toast('Invalid file','error')}};r.readAsText(f)}
function resetData(){if(!confirm(t('confirm_delete')))return;DB=seedDB();saveDB();applySettings();toast(t('saved'));renderAdmin()}
function uploadTo(fieldId,e){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast(LANG==='ar'?'الملف كبير (الحد 2MB)':'File too large (max 2MB)','error');return}const r=new FileReader();r.onload=()=>{$('#'+fieldId).value=r.result;toast(t('saved'))};r.readAsDataURL(f)}
function handleFileUpload(e,field){uploadTo(field,e)}

function appendShot(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const el=$('#fm-screenshots');el.value=(el.value?el.value+', ':'')+r.result;toast(t('saved'))};r.readAsDataURL(f)}
function saveItem(ty,id){
const g=k=>($('#fm-'+k)?.value||'').trim();
try{
if(ty==='app'){const nm=g('name_ar');if(!nm||!g('downloadUrl')){toast(LANG==='ar'?'أكمل الحقول المطلوبة':'Required fields missing','error');return}
const data={name_ar:nm,name_en:g('name_en')||nm,type:$('#fm-type').value,category:$('#fm-category').value,icon:g('icon')||'📱',color:$('#fm-color').value,version:g('version')||'1.0.0',size:g('size')||'50 MB',os:g('os')||'Android',developer:g('developer')||'APPZONE',downloadUrl:g('downloadUrl'),screenshots:g('screenshots').split(',').map(s=>s.trim()).filter(Boolean),desc_ar:g('desc_ar'),desc_en:g('desc_en'),featured:$('#fm-featured').checked,active:$('#fm-active').checked,updatedAt:todayStr()};
if(id){Object.assign(DB.apps.find(x=>x.id===id),data)}else{DB.apps.unshift({id:uid(),slug:slugify(nm)+'-'+Math.random().toString(36).slice(2,6),downloads:0,views:0,ratingAvg:0,ratingsCount:0,externalLinks:[],createdAt:new Date().toISOString(),...data})}}
if(ty==='video'){const nm=g('title_ar');if(!nm){toast('Title required','error');return}
const data={title_ar:nm,title_en:g('title_en')||nm,category:$('#fm-category').value,duration:g('duration')||'10:00',thumbnail:g('thumbnail')||('https://picsum.photos/seed/'+uid()+'/600/340'),youtubeUrl:g('youtubeUrl'),videoUrl:g('videoUrl'),desc_ar:g('desc_ar'),desc_en:g('desc_en'),featured:$('#fm-featured').checked,active:$('#fm-active').checked};
if(id){Object.assign(DB.videos.find(x=>x.id===id),data)}else{DB.videos.unshift({id:uid(),slug:slugify(nm)+'-'+Math.random().toString(36).slice(2,6),views:0,ratingAvg:0,ratingsCount:0,createdAt:todayStr(),...data})}}
if(ty==='website'){const nm=g('name_ar');if(!nm||!g('url')){toast('Required fields','error');return}
const data={name_ar:nm,name_en:g('name_en')||nm,category:$('#fm-category').value,logo:g('logo')||'🌐',image:g('image')||('https://picsum.photos/seed/'+uid()+'/600/340'),url:g('url'),desc_ar:g('desc_ar'),desc_en:g('desc_en'),featured:$('#fm-featured').checked,active:$('#fm-active').checked};
if(id){Object.assign(DB.websites.find(x=>x.id===id),data)}else{DB.websites.unshift({id:uid(),slug:slugify(nm)+'-'+Math.random().toString(36).slice(2,6),views:0,ratingAvg:0,ratingsCount:0,createdAt:todayStr(),...data})}}
if(ty==='category'){const nm=g('name_ar');if(!nm){toast('Name required','error');return}
const data={name_ar:nm,name_en:g('name_en')||nm,slug:g('slug')||slugify(nm),type:$('#fm-type').value,icon:g('icon')||'📁',color:g('color')||'#6366f1'};
if(id){Object.assign(DB.categories.find(x=>x.id===id),data)}else{DB.categories.push({id:uid(),...data})}}
saveDB();closeModal();toast(t('saved'));renderAdmin();renderHeader();
}catch(err){toast('Error: '+err.message,'error')}
}

function showSitemap(){const urls=['/','/apps','/games','/videos','/websites','/ai','/tools',...DB.apps.map(a=>'/apps/'+a.slug),...DB.videos.map(v=>'/videos/'+v.slug),...DB.websites.map(w=>'/websites/'+w.slug)];
showModal(`<div class="p-6"><div class="flex items-center justify-between mb-4"><h2 class="font-black text-lg">🗺️ sitemap.xml</h2><button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800">✕</button></div><pre class="p-4 rounded-2xl bg-slate-900 text-emerald-300 text-[11px] overflow-auto max-h-[60vh]" dir="ltr">${esc('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+urls.map(u=>`  <url><loc>https://appzone.com${u}</loc><changefreq>daily</changefreq></url>`).join('\n')+'\n</urlset>')}</pre><button onclick="dlSitemap()" class="btn-p w-full mt-3 py-3 rounded-2xl font-black text-sm">📥 Download sitemap.xml</button></div>`)}
function dlSitemap(){const urls=['/','/apps','/games','/videos','/websites',...DB.apps.map(a=>'/apps/'+a.slug)];const xml='<?xml version="1.0"?><urlset>'+urls.map(u=>`<url><loc>https://appzone.com${u}</loc></url>`).join('')+'</urlset>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'text/xml'}));a.download='sitemap.xml';a.click()}

function showSql(){showModal(`<div class="p-6"><div class="flex items-center justify-between mb-4"><h2 class="font-black text-lg">🗄️ MySQL Schema</h2><button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800">✕</button></div><pre class="p-4 rounded-2xl bg-slate-900 text-sky-300 text-[11px] overflow-auto max-h-[60vh]" dir="ltr">${esc(`CREATE DATABASE appzone CHARACTER SET utf8mb4;

CREATE TABLE videos(id INT AUTO_INCREMENT PRIMARY KEY, slug VARCHAR(150) UNIQUE, title_ar VARCHAR(250), title_en VARCHAR(250), description TEXT, category_id INT, thumbnail VARCHAR(500), youtube_url VARCHAR(500), video_url VARCHAR(500), duration VARCHAR(20), views INT DEFAULT 0, rating_avg DECIMAL(3,2) DEFAULT 0, featured BOOLEAN DEFAULT 0, active BOOLEAN DEFAULT 1, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, FOREIGN KEY(category_id) REFERENCES categories(id));
CREATE TABLE websites(id INT AUTO_INCREMENT PRIMARY KEY, slug VARCHAR(150) UNIQUE, name_ar VARCHAR(200), name_en VARCHAR(200), description TEXT, category_id INT, logo VARCHAR(20), image VARCHAR(500), url VARCHAR(500), views INT DEFAULT 0, rating_avg DECIMAL(3,2) DEFAULT 0, featured BOOLEAN DEFAULT 0, active BOOLEAN DEFAULT 1, FOREIGN KEY(category_id) REFERENCES categories(id));
CREATE TABLE ratings(id INT AUTO_INCREMENT PRIMARY KEY, item_type ENUM('app','video','website'), item_id INT, stars TINYINT, ip VARCHAR(45), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, UNIQUE(item_type,item_id,ip));
CREATE TABLE favorites(id INT AUTO_INCREMENT PRIMARY KEY, device_id VARCHAR(100), item_type VARCHAR(20), item_id INT);

-- Default admin: INSERT INTO admins(name,email,password) VALUES('Admin','admin@appzone.com', bcrypt_hash);`)}</pre></div>`,'max-w-3xl')}

/* ============================================================ ROUTER */
function render(){
applyLang();applyTheme();applySettings();renderHeader();renderFooter();
const raw=(location.hash||'#/').slice(1);const [pathQ]=[raw];const [path] = pathQ.split('?');const parts=path.split('/').filter(Boolean);
window.scrollTo({top:0});
if(parts.length===0){DB.stats.visits++;saveDB();renderHome()}
else if(parts[0]==='apps'&&!parts[1])renderListing('apps');
else if(parts[0]==='games'&&!parts[1])renderListing('games');
else if(parts[0]==='ai'&&!parts[1])renderListing('ai');
else if(parts[0]==='tools'&&!parts[1])renderListing('tools');
else if(parts[0]==='videos'&&!parts[1])renderListing('videos');
else if(parts[0]==='websites'&&!parts[1])renderListing('websites');
else if(['apps','games','ai','tools'].includes(parts[0])&&parts[1])renderAppDetail(decodeURIComponent(parts[1]));
else if(parts[0]==='videos'&&parts[1])renderVideoDetail(decodeURIComponent(parts[1]));
else if(parts[0]==='websites'&&parts[1])renderWebsiteDetail(decodeURIComponent(parts[1]));
else if(parts[0]==='category'&&parts[1])renderCategory(decodeURIComponent(parts[1]));
else if(parts[0]==='search')renderSearch();
else if(parts[0]==='favorites')renderFavorites();
else if(['privacy','terms','contact'].includes(parts[0]))renderStatic(parts[0]);
else if(parts[0]==='admin')renderAdmin();
else render404();
renderHeader();
}
window.addEventListener('hashchange',render);
window.addEventListener('scroll',()=>{const b=$('#toTop');if(window.scrollY>500){b.classList.remove('hidden');b.classList.add('flex')}else{b.classList.add('hidden');b.classList.remove('flex')}});
/* init */
if(!location.hash)location.hash='#/';
render();
setTimeout(()=>{const p=$('#preloader');p.style.opacity='0';setTimeout(()=>p.remove(),450)},900);
</script>
